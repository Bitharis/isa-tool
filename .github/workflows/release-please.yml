name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release-as:
        description: Version to release from the current main branch, for example 1.2.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ inputs.release-as }}